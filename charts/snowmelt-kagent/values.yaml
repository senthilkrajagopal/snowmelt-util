# snowmelt-kagent — kagent (agentic AI for Kubernetes) alongside the snowmelt
# stack. Everything below sits under the `kagent:` key because this is a thin
# wrapper around the vendored upstream chart; only the commentary and the
# defaults are ours.
#
# TWO RELEASES, CRDs FIRST (see charts/snowmelt-kagent-crds/Chart.yaml for why
# they cannot be one):
#
#   helm upgrade --install kagent-crds ./charts/snowmelt-kagent-crds \
#     -n kagent --create-namespace
#   helm upgrade --install kagent      ./charts/snowmelt-kagent \
#     -n kagent -f deploy/contabo-kagent.yaml
#
# OWN NAMESPACE: unlike snowmelt-extras (which must share snowmelt's namespace),
# kagent is namespace-independent — it talks to nothing in snowmelt over
# unqualified DNS. Anything below that points at the snowmelt release uses a
# `<svc>.<ns>.svc.cluster.local` FQDN, so `kagent` as the namespace is fine.
#
# THE API KEY IS NEVER IN THIS FILE. `providers.<p>.apiKey` would render the key
# into a chart-managed Secret and therefore into git; we leave it unset and let
# the chart reference a Secret created out of band (see deploy/deploy-kagent.sh).

# ── Direct (UNPROXIED) NodePort for the UI ───────────────────────────────────
# See templates/ui-nodeport-service.yaml. The upstream ui Service template
# accepts no `nodePort`, so `kagent.ui.service.type: NodePort` would hand out a
# RANDOM port that changes across reinstalls; this adds a SECOND Service on a
# fixed port selecting the same pods.
#
# ⚠ THIS BYPASSES oauth2-proxy. It reaches kagent-ui directly, so with
# oauth2-proxy enabled below, turning this on re-opens the unauthenticated door
# the proxy exists to close — and the controller in `trusted-proxy` mode trusts
# whatever Authorization header arrives. Use it only when oauth2-proxy is off,
# or for a debug session on a port you keep firewalled.
#
# When oauth2-proxy IS enabled, expose that instead: it has its own NodePort
# support (`kagent.oauth2-proxy.service.type/nodePort`), so this stays off.
uiNodePort:
  enabled: false
  port: 30082

# ── Direct PromQL access to snowmelt ─────────────────────────────────────────
# Renders templates/snowmelt-promql-mcp.yaml: a Prometheus MCP server pointed
# straight at snowmelt's PromQL API, plus an Agent bound to its tools. See that
# file's header for why neither kagent's promql-agent (prompt-only, no tools)
# nor grafana-mcp (queries via Grafana's datasource proxy) covers this.
snowmeltPromql:
  enabled: true
  name: snowmelt-promql-mcp
  agentName: snowmelt-promql-agent

  # THE /promql PREFIX IS REQUIRED. snowmelt serves the Prometheus HTTP API
  # under a path prefix, not at the root: the real endpoints are
  # <url>/api/v1/query, <url>/api/v1/query_range, and so on. The MCP client
  # appends /api/v1/... to this value verbatim, so dropping the prefix 404s
  # every call. Cross-namespace FQDN because kagent runs in its own namespace;
  # 9092 is snowmelt's promqlPort.
  url: "http://snowmelt.default.svc.cluster.local:9092/promql"

  # prometheus-mcp-server. Pinned to a released tag rather than `latest` so a
  # pod restart cannot silently change the tool surface underneath the agent.
  image:
    repository: ghcr.io/pab1it0/prometheus-mcp-server
    tag: "1.6.2"
    pullPolicy: IfNotPresent
  port: 8080

  # Defaults to the chart-wide `default-model-config` when empty.
  modelConfigRef: ""

kagent:
  # ── Model provider ─────────────────────────────────────────────────────────
  # WE RUN MISTRAL, AND THAT IS WHY THIS BLOCK SAYS `openAI`.
  #
  # kagent's ModelConfig CRD has a closed provider enum — Anthropic, OpenAI,
  # AzureOpenAI, Ollama, Gemini, GeminiVertexAI, AnthropicVertexAI, Bedrock,
  # SAPAICore. There is no Mistral member. Mistral does serve an
  # OpenAI-compatible API, so we drive it through the OpenAI provider with
  # `openAI.baseUrl` re-pointed at api.mistral.ai.
  #
  # THE KEY NAME `openAI` IS LOAD-BEARING — DO NOT RENAME IT TO `mistral`.
  # templates/modelconfig.yaml emits the provider config block under the literal
  # value of `providers.default`:
  #     {{ $dot.Values.providers.default }}:
  #       {{- toYaml $model.config | nindent 4 }}
  # so `providers.default: mistral` would render a `mistral:` field on the
  # ModelConfig spec, which the CRD schema rejects. The values key must equal
  # the CRD field name, i.e. `openAI`.
  #
  # COMPATIBILITY CAVEAT: OpenAI-compatible is not OpenAI. Mistral's endpoint
  # covers chat completions and function calling, which is what the agents need,
  # but it is not bug-for-bug identical — strict/structured function-calling
  # modes and parallel tool calls are the usual places a difference shows up.
  # If an agent starts looping or emitting malformed tool calls, that is the
  # first thing to suspect; `mistral-large-latest` is the most reliable
  # tool-caller if `mistral-medium-latest` proves shaky.
  providers:
    default: openAI
    openAI:
      provider: OpenAI
      # Mistral model id, not an OpenAI one. devstral is Mistral's agentic/coding
      # line — `function_calling: true` and a 262144-token context per
      # GET /v1/models, which is what these agents need (they tool-call in a loop
      # and carry cluster state in the conversation). Aliased upstream as
      # devstral-medium-latest / devstral-latest / mistral-code-agent-latest;
      # pinned to the dated id so a silent upstream re-alias can't change the
      # model under a running deployment.
      #
      # Alternatives if it disappoints:
      #   mistral-large-latest   — general-purpose, strong tool-calling
      #   mistral-medium-latest  — cheaper general-purpose
      # Confirm any replacement is `function_calling: true` first:
      #   curl -H "Authorization: Bearer $KEY" https://api.mistral.ai/v1/models
      model: "devstral-2512"
      # Secret created out of band by deploy/deploy-kagent.sh — NOT by this
      # chart. The chart only mints a Secret when `apiKey` is also set, which we
      # deliberately never do; leaving it unset keeps the key out of git and out
      # of `helm get values`.
      apiKeySecretRef: kagent-mistral
      apiKeySecretKey: OPENAI_API_KEY
      config:
        # Mistral's OpenAI-compatible base. The trailing `/v1` is required —
        # the client appends `/chat/completions` to whatever is set here.
        baseUrl: "https://api.mistral.ai/v1"

  # ── Database ───────────────────────────────────────────────────────────────
  # Bundled Postgres (kagent/kagent/kagent) — dev/eval grade, which is what this
  # box is. It holds agent sessions and chat history, so the PVC is worth
  # keeping across upgrades. Point `postgres.url` at an external instance to
  # outgrow it. NOTE: this is kagent's OWN Postgres, deliberately not the
  # snowmelt release's `snowmelt-postgres` — sharing would couple kagent's
  # lifecycle to snowmelt's metadata store for no benefit.
  database:
    postgres:
      bundled:
        enabled: true
        storage: 2Gi

  # ── Controller ─────────────────────────────────────────────────────────────
  controller:
    # `trusted-proxy` — the controller takes identity from the JWT in the
    # Authorization header and does NOT verify it. That is the whole security
    # model: oauth2-proxy is what authenticates, and the controller trusts it.
    #
    # THE CONSEQUENCE IS THAT THE CONTROLLER MUST NEVER BE REACHABLE EXCEPT
    # THROUGH THE PROXY. Anything that can reach kagent-ui or kagent-controller
    # directly can mint its own Authorization header and be whoever it likes.
    # Both are ClusterIP; keep `uiNodePort.enabled: false` while this is set.
    #
    # The other mode is `unsecure`: no auth at all, identity from an X-User-Id
    # header, defaulting to admin@kagent.dev. Use it only with the whole thing
    # behind a port-forward.
    auth:
      mode: trusted-proxy
      # Which JWT claim becomes the kagent user id. Default is `sub`, which
      # from Keycloak is an opaque UUID — every session in the UI would be
      # labelled with it. `email` is the same identity in readable form and
      # matches how the snowmelt side keys its OIDC accounts.
      userIdClaim: email
    # Watch every namespace: the k8s-agent's whole job is inspecting workloads,
    # and snowmelt lives in `default` while the OTel demo lives in `demo`.
    watchNamespaces: []

  # ── UI ─────────────────────────────────────────────────────────────────────
  # ClusterIP by default — port-forward to reach it. Environment overlays
  # (deploy/contabo-kagent.yaml) switch this to a NodePort.
  ui:
    service:
      type: ClusterIP
      ports:
        port: 8080
        targetPort: 8080

  # ── Built-in tool servers ──────────────────────────────────────────────────
  # kagent-tools: the kubectl/shell/HTTP tool MCP server the agents actually act
  # through. Required for the k8s and helm agents to do anything.
  kagent-tools:
    enabled: true

  # kmcp: the MCPServer controller — lets you declare extra MCP tool servers as
  # CRs later without re-deploying kagent.
  kmcp:
    enabled: true

  # querydoc: doc2vec documentation search. OFF — it embeds with OpenAI and
  # takes only an OPENAI_API_KEY (`querydoc.openai.apiKey`), which a Mistral key
  # will not satisfy. Turn on only if you add a real OpenAI key.
  querydoc:
    enabled: false

  # grafana-mcp: gives the observability-agent live Grafana access — dashboard
  # search, datasource queries, alert rules. This is the path by which an agent
  # can actually RUN a query against snowmelt, rather than only write one.
  #
  # THREE THINGS MUST LINE UP or the agent starts and fails every tool call:
  #   1. Grafana running in the snowmelt-extras release
  #      (observability.grafana.enabled=true). It is NOT on in the stress-mode
  #      overlays, which exist to maximise ingest throughput.
  #   2. The Snowmelt-PromQL datasource provisioned. Note that
  #      templates/grafana-datasource.yaml in snowmelt-extras used to gate the
  #      whole ConfigMap on prometheus.enabled too — Grafana-without-Prometheus
  #      came up with zero datasources. Fixed there; mentioned here because the
  #      symptom (agent reaches Grafana, finds nothing to query) points at this
  #      file rather than that one.
  #   3. A Grafana service-account token in a Secret keyed
  #      GRAFANA_SERVICE_ACCOUNT_TOKEN, named by `grafana.secretRef`. Created
  #      out of band like every other credential here; Viewer role is enough
  #      and is what you want — an LLM agent with Editor can rewrite dashboards.
  #
  # The URL is the cross-namespace FQDN of snowmelt-extras' Grafana, whose
  # Service listens on :80.
  grafana-mcp:
    enabled: true
    grafana:
      url: "http://snowmelt-extras-grafana.default.svc.cluster.local:80/api"
      secretRef: kagent-grafana

    # REQUIRED, or the RemoteMCPServer never reconciles. mcp-grafana carries
    # DNS-rebinding protection that validates the Host header against an
    # allowlist defaulting to loopback variants of --address. The kagent
    # controller dials it by Service DNS, so every initialize is answered
    # `403 forbidden: host not allowed`, and the RemoteMCPServer sits at
    # Accepted=False with:
    #   failed to fetch tools ... calling "initialize": Forbidden
    # The agent then loads with no Grafana tools and — the confusing part —
    # cheerfully tells the user it has no access rather than erroring.
    #
    # The names below are the forms the in-cluster Service resolves under.
    # NOT "*": the flag's own help notes that disables validation entirely and
    # is only safe behind a trusted reverse proxy that rewrites Host, which
    # this is not. Adjust if the release name or namespace changes.
    args:
      - --allowed-hosts
      - "kagent-grafana-mcp:8000,kagent-grafana-mcp.kagent:8000,kagent-grafana-mcp.kagent.svc:8000,kagent-grafana-mcp.kagent.svc.cluster.local:8000"

  # ── Built-in agents ────────────────────────────────────────────────────────
  # Each enabled agent is its own Deployment, so this list is the pod budget.
  # On by default: only the ones with something to work on in this cluster.
  k8s-agent:
    enabled: true
  helm-agent:
    enabled: true
  # Generates PromQL from natural language. Purely prompt-driven — it writes
  # queries, it does not execute them, so it needs no datasource wiring and is
  # backend-agnostic: its output runs against snowmelt's PromQL endpoint
  # (snowmelt.default.svc.cluster.local:9092/promql) just as well as against
  # Prometheus. To actually RUN what it writes, enable grafana-mcp above.
  promql-agent:
    enabled: true

  # Queries Grafana through grafana-mcp above — dashboards, datasources, alert
  # rules. The one agent here that can execute a PromQL query end to end.
  observability-agent:
    enabled: true

  # ⚠ THE SIX BELOW HAVE NO BACKING INFRASTRUCTURE ON THIS CLUSTER.
  # Enabled at the operator's explicit request so they appear in the UI, but be
  # clear about what that buys: verified on 2026-08-15, this k3s node runs
  # FLANNEL (10-flannel.conflist) and has ZERO cilium CRDs, ZERO istio.io CRDs,
  # ZERO argoproj.io CRDs and ZERO gateway.networking CRDs. Each agent's tools
  # target exactly those APIs — the cilium CLI and CiliumNetworkPolicy, istioctl
  # and VirtualService, Rollout resources, Gateway/HTTPRoute.
  #
  # So they will load, accept a prompt, reason about it, and then fail at the
  # tool call. They are useful for exploring prompts and for demoing the agent
  # catalogue; they are not useful for doing work. Set back to false to reclaim
  # six pods (~300m CPU / 768Mi of requests) the moment they stop earning their
  # place.
  istio-agent:
    enabled: true
  kgateway-agent:
    enabled: true
  argo-rollouts-agent:
    enabled: true
  cilium-policy-agent:
    enabled: true
  cilium-manager-agent:
    enabled: true
  cilium-debug-agent:
    enabled: true

  # ── Off by design ──────────────────────────────────────────────────────────
  # gVisor-sandboxed agent runtime; needs the ate-system install. Keep in step
  # with `substrate.enabled` in the snowmelt-kagent-crds values.
  substrate:
    enabled: false

  # ── oauth2-proxy: the authenticating front door ────────────────────────────
  # Browser → oauth2-proxy → kagent-ui:8080 → (its nginx) → controller:8083.
  # Pairs with controller.auth.mode=trusted-proxy above: oauth2-proxy completes
  # the OIDC code flow and injects the resulting JWT as the Authorization
  # header, which the controller then trusts.
  #
  # The IdP is the Keycloak in the snowmelt-extras release — same realm
  # (`snowmelt`) that fronts snowmelt's own SSO, a second client alongside it.
  # See `keycloak.realmImport.extraClients` in that chart.
  #
  # ENVIRONMENT-SPECIFIC VALUES LIVE IN THE OVERLAY, not here: the issuer and
  # redirect URLs are absolute and externally reachable, so they cannot have a
  # sensible chart-level default. deploy/contabo-kagent.yaml supplies them.
  oauth2-proxy:
    enabled: true

    # Cookie-based sessions; no Redis to run or persist.
    redis:
      enabled: false
    sessionStorage:
      type: cookie

    config:
      # client-id / client-secret / cookie-secret come from a Secret created
      # out of band — same rule as the model API key. The chart would otherwise
      # mint the Secret from inline values, i.e. from git.
      # deploy/deploy-kagent.sh preflights it.
      existingSecret: kagent-oauth2-proxy

    # A LIST, so Helm REPLACES it wholesale rather than merging — every entry
    # the deployment references must be present. The overlay overrides this
    # with the real URLs; these placeholders only keep a bare `helm template`
    # from rendering a deployment with dangling $(VAR) references.
    extraEnv:
      - name: OIDC_ISSUER_URL
        value: ""
      - name: OIDC_REDIRECT_URL
        value: ""
      # Must be the kagent UI Service — "<release>-ui". Wrong here and
      # oauth2-proxy authenticates correctly and then proxies to nothing.
      - name: UPSTREAM_URL
        value: "http://kagent-ui:8080"

    # A MAP, so these deep-merge onto the kagent chart's defaults; only the
    # two below are actually changed.
    extraArgs:
      # FALSE BECAUSE THIS DEPLOYMENT IS PLAIN HTTP. A `secure` cookie is only
      # ever sent back over HTTPS, so leaving the chart's `true` here means the
      # browser silently drops the session cookie and the user ricochets
      # between /oauth2/start and the IdP forever — a redirect loop that looks
      # like an IdP misconfiguration and is not. Set it back to true the moment
      # this sits behind TLS.
      cookie-secure: false
      # The chart's default asks for "openid profile email groups". Keycloak
      # validates requested scopes against the ones assigned to the client and
      # rejects the authorization request outright with `invalid_scope` if any
      # is unknown — and this realm defines no `groups` client scope. Drop it;
      # nothing here consumes group claims.
      scope: "openid profile email"

  # ── Tracing kagent itself into snowmelt ────────────────────────────────────
  # Off by default; the contabo overlay turns it on. kagent speaks OTLP, and
  # snowmelt's collector is an OTLP endpoint, so the agent runtime can be
  # observed by the stack it is deployed to observe.
  otel:
    tracing:
      enabled: false
      exporter:
        otlp:
          endpoint: ""
          protocol: "grpc"
          insecure: true
    logging:
      enabled: false
      exporter:
        otlp:
          endpoint: ""
          insecure: true
