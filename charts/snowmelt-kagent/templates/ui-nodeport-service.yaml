{{- if .Values.uiNodePort.enabled }}
{{/*
  Pinned-NodePort Service for the kagent UI — OURS, not the subchart's.

  Why a second Service instead of `kagent.ui.service.type: NodePort`: the
  upstream ui-service.yaml template renders only `port` and `targetPort` (there
  is no `.Values.ui.service.ports.nodePort`), so setting the type to NodePort
  there gets you a RANDOM port out of the 30000-32767 range on every reinstall.
  This box addresses services by fixed NodePort, so the port has to be pinned.

  The subchart's own Service is left as ClusterIP and untouched; this one adds a
  second, externally reachable address for the same pods.

  Selector must mirror the subchart's `kagent.ui.selectorLabels`:
    name     = .Chart.Name of the kagent subchart ("kagent"), or its nameOverride
    instance = the release name (shared — subcharts see the parent's .Release)
    component = ui
  Recomputed here because a parent chart cannot call a subchart's helpers.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-ui-nodeport
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.kagent.nameOverride | default "kagent" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: kagent
spec:
  type: NodePort
  ports:
    - port: {{ .Values.kagent.ui.service.ports.port }}
      targetPort: {{ .Values.kagent.ui.service.ports.targetPort }}
      nodePort: {{ .Values.uiNodePort.port }}
      protocol: TCP
      name: ui
  selector:
    app.kubernetes.io/name: {{ .Values.kagent.nameOverride | default "kagent" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: ui
{{- end }}
