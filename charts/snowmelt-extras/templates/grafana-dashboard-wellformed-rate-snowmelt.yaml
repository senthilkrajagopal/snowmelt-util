{{- if and .Values.observability.grafana.enabled .Values.observability.prometheus.enabled }}
# Grafana dashboard for the rate() counter twins, wired against the
# `snowmelt` datasource UID. Companion:
# `grafana-dashboard-wellformed-rate-prometheus.yaml`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snowmelt.fullname" . }}-grafana-dashboard-wellformed-rate-snowmelt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowmelt.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  wellformed-rate-snowmelt.json: |-
{{ .Files.Get "files/wellformed-rate-snowmelt.json" | indent 4 }}
{{- end }}
