{{- if and .Values.observability.grafana.enabled .Values.observability.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snowmelt.fullname" . }}-grafana-dashboard-mongodb-snowmelt
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowmelt.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  mongodb-snowmelt.json: |-
{{ .Files.Get "files/mongodb-snowmelt.json" | indent 4 }}
{{- end }}
