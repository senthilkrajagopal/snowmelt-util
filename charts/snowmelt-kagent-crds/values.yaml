# snowmelt-kagent-crds — cluster-scoped CRDs for kagent. Install BEFORE
# snowmelt-kagent, as its own release:
#
#   helm upgrade --install kagent-crds ./charts/snowmelt-kagent-crds \
#     -n kagent --create-namespace
#   helm upgrade --install kagent      ./charts/snowmelt-kagent \
#     -n kagent -f deploy/contabo-kagent.yaml
#
# CRDs are cluster-scoped, so the namespace here only owns the Helm release
# metadata; keeping it in `kagent` alongside the main release is just tidiness.
#
# UNINSTALLING THIS DELETES EVERY kagent CUSTOM RESOURCE IN THE CLUSTER —
# removing a CRD cascades to its CRs. Uninstall snowmelt-kagent first, and
# only remove this release when you actually want kagent gone.

kagent-crds:
  # Gates the kmcp-crds subchart (MCPServer). Keep in step with
  # `kmcp.enabled` in the snowmelt-kagent values — the kagent controller
  # reconciles MCPServer resources when kmcp is on.
  kmcp:
    enabled: true

  # Agent Substrate (ActorTemplate / WorkerPool) — the gVisor-sandboxed agent
  # runtime. Off, matching `substrate.enabled: false` in snowmelt-kagent.
  substrate:
    enabled: false
