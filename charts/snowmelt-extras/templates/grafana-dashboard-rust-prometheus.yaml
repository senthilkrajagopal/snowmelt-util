{{- if and .Values.observability.grafana.enabled .Values.observability.prometheus.enabled }}
# Grafana dashboard for snowmelt-app (Rust process + emitted
# metrics), wired against the `prometheus` datasource UID.
# Companion: `grafana-dashboard-rust-snowmelt.yaml`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "snowmelt.fullname" . }}-grafana-dashboard-rust-prometheus
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "snowmelt.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  rust-prometheus.json: |-
{{ .Files.Get "files/rust-prometheus.json" | indent 4 }}
{{- end }}
