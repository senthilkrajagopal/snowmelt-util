# Keycloak test-IdP overlay for the contabo stress box (62.171.163.164).
#
# Layer ON TOP of whatever extras values are already live:
#   helm upgrade snowmelt-extras ./charts/snowmelt-extras \
#     -f /root/live-extras-values.yaml \
#     -f deploy/contabo-extras-keycloak.yaml -n default
#
# Pairs with the snowmelt-side config in deploy/contabo-oidc.yaml.
#
# THROWAWAY IdP: dev-mem H2, no TLS, realm re-imported on every start, and the
# client secret and user passwords are in a ConfigMap in plain text. It is
# reachable from the public internet on :30081. Only for testing the SSO flow —
# tear it down (`--set keycloak.enabled=false`) when finished.
keycloak:
  enabled: true

  # The externally reachable base URL. Must be exact: Keycloak derives the
  # `issuer` from it, snowmelt refuses a discovery document whose issuer
  # disagrees with its configured value, and the browser follows
  # `authorization_endpoint` out of that same document. The node IP satisfies
  # both the pods (routable from inside the cluster) and the browser.
  #
  # KC_HOSTNAME MUST INCLUDE THE RELATIVE PATH (`/auth`, this chart's default).
  # Verified the hard way: with a bare `http://<ip>:30081`, Keycloak still
  # SERVES under /auth but ADVERTISES issuer and endpoints without it, so the
  # discovery document is internally inconsistent — its own jwks_uri and
  # authorization_endpoint both 404. Including the path makes the advertised
  # URLs match where the server actually listens.
  #
  # Resulting issuer: http://62.171.163.164:30081/auth/realms/snowmelt
  #
  # KC_BOOTSTRAP_ADMIN_PASSWORD IS FIRST-BOOT-ONLY and this instance booted on
  # 2026-08-09, so the value below did NOT set the live password. The running
  # admin password was rotated to `sn0wmelt` on 2026-08-15 through
  # `kcadm.sh set-password` (old `admin` now rejected, verified). The two agree
  # today; they agree in future only for a fresh install or after the PVC is
  # deleted. See the note in charts/snowmelt-extras/values.yaml.
  extraEnv: |
    - name: KC_BOOTSTRAP_ADMIN_USERNAME
      value: admin
    - name: KC_BOOTSTRAP_ADMIN_PASSWORD
      value: sn0wmelt
    - name: KC_HOSTNAME
      value: "http://62.171.163.164:30081/auth"
    - name: KC_HOSTNAME_STRICT
      value: "false"

  # Persist the embedded H2 database on the box's data disk, so users
  # configured here (and anything added later in the admin console) survive a
  # pod restart. `storage-db` is the nvme2-backed class on this node.
  volumeClaimTemplates: |
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: storage-db
        resources:
          requests:
            storage: 1Gi

  realmImport:
    # Byte-for-byte identical to admin.oidc.providers.keycloak.redirect-url.
    redirectUris:
      - "http://62.171.163.164:30080/api/auth/oidc/keycloak/callback"

    # Second relying party on this realm: oauth2-proxy, fronting the kagent UI
    # on :30082 (see deploy/contabo-kagent.yaml). The redirect URI is
    # oauth2-proxy's fixed callback path and must match byte-for-byte — the
    # `--redirect-url` flag it is given, and what Keycloak compares against.
    #
    # SEEDED ON FIRST BOOT ONLY. This entry did not create the live client;
    # that was done with kcadm.sh against the running instance on 2026-08-15.
    # It is here so a rebuilt Keycloak comes up with the client already
    # present rather than needing the manual step again.
    #
    # Dev-only secret, in a ConfigMap in plain text exactly like the snowmelt
    # client's. Nothing on this realm is confidential.
    extraClients:
      - clientId: kagent
        name: Kagent
        secret: kagent-dev-secret
        redirectUris:
          - "http://62.171.163.164:30082/oauth2/callback"
