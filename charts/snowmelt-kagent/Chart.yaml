apiVersion: v2
name: snowmelt-kagent
description: >
  kagent — the Kubernetes-native agentic AI runtime (controller + web UI +
  MCP tool servers + a set of built-in SRE agents) wired for the snowmelt
  stack. Installs in its OWN namespace (`kagent`) and reaches the snowmelt
  release cross-namespace by service FQDN. Requires the
  `snowmelt-kagent-crds` release to be installed FIRST.
type: application
version: 0.1.0
appVersion: "0.9.12"

dependencies:
  # Upstream kagent. Vendored as charts/kagent-0.9.12.tgz (pulled from
  # oci://ghcr.io/kagent-dev/kagent/helm/kagent) so a deploy needs no registry
  # access. The tarball already carries every one of its own subcharts —
  # kmcp, kagent-tools, grafana-mcp, querydoc, oauth2-proxy, substrate and the
  # ten built-in agents — so there is nothing further to fetch.
  - name: kagent
    version: "0.9.12"
    repository: oci://ghcr.io/kagent-dev/kagent/helm
